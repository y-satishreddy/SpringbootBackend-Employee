spring:
  application:
    name: department-service

  config:
    import: "optional:configserver:http://localhost:8088"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: department-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.value.default.type: pl.piomin.services.department.event.EmployeeOnboardEvent
        spring.json.trusted.packages: pl.piomin.services.department.event
        spring.json.use.type.headers: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/employee}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:S@tish200}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

logging:
  level:
    org.springframework.kafka: DEBUG
    org.apache.kafka: INFO